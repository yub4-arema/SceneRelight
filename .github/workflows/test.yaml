name: Test
run-name: ${{ github.ref_name }} test run 🧪
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless-test:
    name: Headless OBS test (Ubuntu) 🧪
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libobs-dev obs-studio libx11-dev \
            xvfb xauth libgl1-mesa-dri libegl-mesa0 python3-numpy python3-pil
      - name: Build
        run: |
          cmake --preset ubuntu-x86_64 -DHZ_BUILD_TOOLS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build_x86_64
      - name: Run headless test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1280x720x24" python3 tests/headless_test.py build_x86_64

  # main 以外のブランチでも Windows / macOS / Ubuntu のビルドを確かめる（main は push.yaml が行う）
  build-project:
    name: Build Project 🧱
    if: github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'master' && github.ref_type == 'branch'
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read
