<title>なじませ評価シート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f3f4f7;--panel:#ffffff;--fg:#1d2230;--mute:#667086;--line:#d9dde7;--accent:#2a5fd6;--chip:#e8ebf2;
 --s1:#c53a3a;--s2:#d9772b;--s3:#8a93a6;--s4:#3f9a62;--s5:#1f8a4c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--panel:#1d212c;--fg:#e8ebf3;--mute:#9aa3b8;--line:#2d3342;--accent:#7ea2ff;--chip:#262b39;
 --s1:#ff7b7b;--s2:#f0a35e;--s3:#a3acc0;--s4:#6fd69b;--s5:#4fe08a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171f;--panel:#1d212c;--fg:#e8ebf3;--mute:#9aa3b8;--line:#2d3342;--accent:#7ea2ff;--chip:#262b39;
 --s1:#ff7b7b;--s2:#f0a35e;--s3:#a3acc0;--s4:#6fd69b;--s5:#4fe08a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;margin:0;line-height:1.45;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{max-width:620px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:10px;padding-block:12px 20px}
.top{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.top b{color:var(--fg);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.lnk{border:0;background:none;color:var(--accent);font-size:13px;cursor:pointer;font-family:inherit;padding:6px 4px}
.stage{position:relative;touch-action:pan-y;user-select:none}
.stage img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:10px;border:1px solid var(--line)}
.meta{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.meta .t{color:var(--fg);font-weight:600;width:100%;font-size:14px;overflow-wrap:anywhere}
.tag{background:var(--chip);border-radius:4px;padding:0 6px;font-size:12px}
.q{font-size:13px;color:var(--mute);text-align:center;margin-top:2px}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;border:2px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;font-family:inherit;cursor:pointer;padding:6px 2px}
.rb .n{font-size:22px;font-weight:700;line-height:1}
.rb .w{font-size:11px;color:var(--mute);line-height:1.2;text-align:center}
.rb[aria-pressed="true"]{color:#fff}
.rb[aria-pressed="true"] .w{color:#fff}
.rb[data-v="1"]{border-color:var(--s1)}.rb[data-v="2"]{border-color:var(--s2)}.rb[data-v="3"]{border-color:var(--s3)}.rb[data-v="4"]{border-color:var(--s4)}.rb[data-v="5"]{border-color:var(--s5)}
.rb[data-v="1"][aria-pressed="true"]{background:var(--s1)}.rb[data-v="2"][aria-pressed="true"]{background:var(--s2)}.rb[data-v="3"][aria-pressed="true"]{background:var(--s3)}.rb[data-v="4"][aria-pressed="true"]{background:var(--s4)}.rb[data-v="5"][aria-pressed="true"]{background:var(--s5)}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tg{border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.tg[aria-pressed="true"]{background:var(--chip);color:var(--fg);border-color:var(--mute)}
.nav{display:flex;gap:8px}
.btn{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:12px 0;font-size:14px;cursor:pointer;font-family:inherit}
.btn:focus-visible,.rb:focus-visible,.tg:focus-visible,.lnk:focus-visible,.th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#st{font-size:12px;color:var(--mute);text-align:center;min-height:1.2em}
#list{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.th{position:relative;border:3px solid var(--line);border-radius:8px;padding:0;background:#000;cursor:pointer;overflow:hidden;aspect-ratio:16/9}
.th img{display:block;width:100%;height:100%;object-fit:cover}
.th span{position:absolute;right:3px;bottom:3px;background:var(--bg);color:var(--fg);font-size:12px;font-weight:700;border-radius:4px;padding:0 5px}
.th[data-v="1"]{border-color:var(--s1)}.th[data-v="2"]{border-color:var(--s2)}.th[data-v="3"]{border-color:var(--s3)}.th[data-v="4"]{border-color:var(--s4)}.th[data-v="5"]{border-color:var(--s5)}
.sum{overflow-x:auto}
table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:3px 8px;text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
h2{font-size:15px;margin:8px 0 4px}
.done{text-align:center;padding:30px 0;color:var(--mute)}
</style>

<div id="app">
  <div class="top"><span><b id="pos">0</b> / <b id="total">0</b></span><div class="bar"><i id="barfill"></i></div><span>評価 <b id="done">0</b></span><button class="lnk" id="tolist">一覧</button></div>
  <div id="card">
    <div class="stage" id="stage"><img id="img" alt=""></div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="q">この見た目は、実際の配信で使えそう？</div>
  <div class="rate" id="rate"></div>
  <div class="tags" id="tags"></div>
  <div class="nav"><button class="btn" id="prev">← 前へ</button><button class="btn" id="skip">あとで →</button></div>
  <div id="st"></div>
  <div id="list" hidden></div>
</div>

<script>
const TILES = __TILES__;
const W = {1: ['1', 'ダメ'], 2: ['2', 'いまいち'], 3: ['3', 'ふつう'], 4: ['4', '良い'], 5: ['5', 'とても良い']};
const TAGS = ['強すぎ', '弱すぎ', '髪が白い'];
const state = {}, dirty = {};
let order = [], idx = 0, db = null, view = 'card';
const $ = id => document.getElementById(id);

// シャッフル順は端末に覚えさせる（再読み込みで順番が変わらないように）
function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function makeOrder() {
  let seed; try { seed = +localStorage.getItem('hz-seed'); } catch (e) {}
  if (!seed) { seed = Math.floor(Math.random() * 2 ** 31) + 1; try { localStorage.setItem('hz-seed', seed); } catch (e) {} }
  const r = seeded(seed), a = TILES.map(t => t.id);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const tile = id => TILES.find(t => t.id === id);
const score = id => (state[id] || {}).score || 0;
function setSt(s) { $('st').textContent = s; }

function save(id) {
  dirty[id] = Date.now();
  const r = state[id] || {};
  const payload = {score: r.score || 0, tags: r.tags || []};
  if (db) db.collection('ratings').doc(id).set(payload).then(() => setSt('保存しました'), e => setSt('保存できませんでした: ' + (e && e.code || '')));
  else try { localStorage.setItem('hz-' + id, JSON.stringify(payload)); setSt('この端末に保存しました'); } catch (e) {}
}

function buildRate() {
  $('rate').textContent = '';
  for (let v = 1; v <= 5; v++) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'rb'; b.dataset.v = v; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span class="n">' + W[v][0] + '</span><span class="w">' + W[v][1] + '</span>';
    b.onclick = () => rate(v);
    $('rate').appendChild(b);
  }
  $('tags').textContent = '';
  TAGS.forEach(n => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tg'; b.textContent = n; b.dataset.n = n; b.setAttribute('aria-pressed', 'false');
    b.onclick = () => { const id = order[idx]; const s = state[id] = state[id] || {}; const a = new Set(s.tags || []); a.has(n) ? a.delete(n) : a.add(n); s.tags = [...a]; save(id); paint(); };
    $('tags').appendChild(b);
  });
}
function rate(v) {
  const id = order[idx]; const s = state[id] = state[id] || {};
  s.score = v; save(id); paint();
  setTimeout(() => { if (order[idx] === id) go(nextUnrated(idx)); }, 280); // 付けたら次へ。戻って付け直せる
}
function nextUnrated(from) {
  for (let k = 1; k <= order.length; k++) { const i = (from + k) % order.length; if (!score(order[i])) return i; }
  return Math.min(from + 1, order.length);
}
function go(i) { idx = Math.max(0, Math.min(order.length, i)); paint(); }

function stats() {
  const done = TILES.filter(t => score(t.id)).length;
  $('total').textContent = TILES.length; $('done').textContent = done;
  $('barfill').style.width = (done / TILES.length * 100) + '%';
}
function paint() {
  stats();
  if (view === 'list') return paintList();
  const finished = idx >= order.length;
  $('card').hidden = $('rate').hidden = $('tags').hidden = $('prev').parentElement.hidden = finished && false;
  if (finished) {
    $('img').removeAttribute('src'); $('meta').innerHTML = '<div class="done" style="width:100%">最後まで見ました。「一覧」から付け直しや、未評価の確認ができます。</div>';
    $('rate').hidden = $('tags').hidden = true; $('pos').textContent = order.length; return;
  }
  const t = tile(order[idx]), r = state[t.id] || {};
  $('pos').textContent = idx + 1;
  const img = $('img'); img.src = 'img/' + t.id + '.jpg'; img.alt = t.bg + ' ' + t.l;
  const m = $('meta'); m.textContent = '';
  const a = document.createElement('div'); a.className = 't'; a.textContent = t.l; m.appendChild(a);
  [t.fg, t.bg, t.pos].forEach(x => { const s = document.createElement('span'); s.className = 'tag'; s.textContent = x; m.appendChild(s); });
  $('rate').hidden = $('tags').hidden = false;
  document.querySelectorAll('.rb').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === r.score)));
  document.querySelectorAll('.tg').forEach(b => b.setAttribute('aria-pressed', String((r.tags || []).includes(b.dataset.n))));
  for (let k = 1; k <= 2; k++) { const n = order[idx + k]; if (n) { const p = new Image(); p.src = 'img/' + n + '.jpg'; } } // 次の画像を先読み
}

// 一覧（付け直し・集計・コピー）
function paintList() {
  const L = $('list'); L.textContent = '';
  const h = document.createElement('h2'); h.textContent = '一覧（タップでその画像へ）'; L.appendChild(h);
  const g = document.createElement('div'); g.className = 'grid';
  order.forEach((id, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'th'; b.dataset.v = score(id) || ''; b.setAttribute('aria-label', id + ' ' + (score(id) || '未評価'));
    const im = document.createElement('img'); im.loading = 'lazy'; im.src = 'img/' + id + '.jpg'; im.alt = '';
    b.appendChild(im); if (score(id)) { const s = document.createElement('span'); s.textContent = score(id); b.appendChild(s); }
    b.onclick = () => { view = 'card'; showView(); go(i); };
    g.appendChild(b);
  });
  L.appendChild(g);
  const h2 = document.createElement('h2'); h2.textContent = '設定ごとの平均（5段階）'; L.appendChild(h2);
  const wrap = document.createElement('div'); wrap.className = 'sum'; const tb = document.createElement('table');
  const hd = tb.insertRow(); ['設定', '平均', '評価数'].forEach(x => { const c = document.createElement('th'); c.textContent = x; hd.appendChild(c); });
  [...new Set(TILES.map(t => t.p))].forEach(p => {
    const ts = TILES.filter(t => t.p === p), sc = ts.map(t => score(t.id)).filter(Boolean);
    const r = tb.insertRow(); [p + ' ' + ts[0].l.slice(0, 20), sc.length ? (sc.reduce((a, b) => a + b, 0) / sc.length).toFixed(1) : '-', sc.length + '/' + ts.length].forEach(x => r.insertCell().textContent = x);
  });
  wrap.appendChild(tb); L.appendChild(wrap);
  const cp = document.createElement('button'); cp.className = 'btn'; cp.type = 'button'; cp.textContent = '結果をコピー（表計算に貼る用）'; cp.style.marginTop = '8px';
  cp.onclick = async () => {
    const rows = [['ID', 'キャラ', '背景', '設定', '設定内容', '配置', '評価(1-5)', 'タグ']];
    TILES.forEach(t => { const r = state[t.id] || {}; rows.push([t.id, t.fg, t.bg, t.p, t.l, t.pos, r.score || '', (r.tags || []).join('/')]); });
    const txt = rows.map(r => r.join('\t')).join('\n');
    try { await navigator.clipboard.writeText(txt); setSt('コピーしました'); } catch (e) { setSt('コピーできませんでした'); }
  };
  L.appendChild(cp);
}
function showView() {
  const list = view === 'list';
  $('list').hidden = !list; $('card').hidden = list; $('rate').hidden = list; $('tags').hidden = list; document.querySelector('.q').hidden = list; document.querySelector('.nav').hidden = list;
  $('tolist').textContent = list ? '← カードに戻る' : '一覧'; paint();
}

$('tolist').onclick = () => { view = view === 'list' ? 'card' : 'list'; showView(); };
$('prev').onclick = () => go(idx - 1);
$('skip').onclick = () => go(idx + 1);
document.addEventListener('keydown', e => {
  if (view !== 'card') return;
  if (e.key >= '1' && e.key <= '5') rate(+e.key); else if (e.key === 'ArrowLeft') go(idx - 1); else if (e.key === 'ArrowRight') go(idx + 1);
});
// スワイプ：左で次へ、右で前へ（評価は付けない）
(() => { let x0 = null, y0 = 0; const el = $('stage');
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
  el.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(idx + (dx < 0 ? 1 : -1)); }); })();

// 起動：先に画面を出し、保存先がつながったら評価を読み込む
order = makeOrder(); buildRate(); paint();
(async () => {
  const timer = setTimeout(() => setSt('保存先に接続できません（この端末にだけ保存）'), 10000);
  try {
    db = await claude.use('db'); clearTimeout(timer);
    if (!db) { setSt('この端末にだけ保存されます'); TILES.forEach(t => { try { const v = localStorage.getItem('hz-' + t.id); if (v) state[t.id] = JSON.parse(v); } catch (e) {} }); idx = nextUnrated(-1); paint(); return; }
    let first = true;
    db.collection('ratings').onSnapshot(snap => {
      if (first) { first = false; snap.docs.forEach(d => { if (!dirty[d.id]) state[d.id] = d.data(); }); idx = nextUnrated(-1); paint(); setSt(''); return; }
      let changed = false;
      snap.docChanges().forEach(ch => { const id = ch.doc.id; if (dirty[id] || ch.doc.metadata.hasPendingWrites) return; if (ch.type === 'removed') delete state[id]; else state[id] = ch.doc.data(); changed = true; });
      if (changed) stats();
    }, e => setSt('読み込みエラー: ' + (e && e.code || '')));
  } catch (e) { clearTimeout(timer); setSt('この端末にだけ保存されます'); }
})();
</script>
